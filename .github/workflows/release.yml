name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write      # the GitHub release
  packages: write      # the ghcr.io image, and its provenance attestation
  id-token: write      # signing the provenance attestations (Sigstore, via OIDC)
  attestations: write  # storing them with the repository

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Newest 1.27 patch release (security fixes); go.mod's go line is only the minimum.
          go-version: '1.27'
          check-latest: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Install Syft
        uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build provenance (SLSA) for the release archives, the checksums and
      # the image, signed with the workflow's identity; users check them with
      # "gh attestation verify" (README, Verify a Release)
      - name: Attest provenance of the archives and checksums
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Find the image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect "ghcr.io/jbweber/foundry:${GITHUB_REF_NAME#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest provenance of the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/jbweber/foundry
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
